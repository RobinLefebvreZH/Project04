<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Blocks — Voxel Real Estate Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a22; --panel:rgba(20,26,34,.97); --line:#2c3644; --ink:#eef2f5; --mute:#93a1b1;
  --gold:#f2c14e; --red:#e5574b; --green:#5cc98a; --blue:#58a6e8; --accent:#e94b3c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#5b95cf,#c4d8e8 55%);font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);font-size:13px}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.px{font-family:"Silkscreen",monospace;letter-spacing:.02em}
.mono{font-family:"IBM Plex Mono",monospace}
.panel{background:var(--panel);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--line),0 6px 0 rgba(0,0,0,.35);border-radius:2px}
button{font:inherit;color:var(--ink);background:#2b3646;border:2px solid #000;box-shadow:inset -2px -3px 0 rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.12);padding:6px 10px;cursor:pointer;border-radius:2px}
button:hover{background:#38475c}
button:active{box-shadow:inset 2px 3px 0 rgba(0,0,0,.35)}
button.on{background:#7a5a16;color:#fff3cf}
button.primary{background:#2f7d4f}
button.primary:hover{background:#38945e}
button.danger{background:#8c2f28}
button.danger:hover{background:#a5392f}
button:disabled{opacity:.45;cursor:not-allowed}
#top{position:fixed;left:8px;right:8px;top:8px;display:flex;align-items:center;gap:14px;padding:6px 10px;z-index:5;flex-wrap:wrap}
#top .logo{font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000;white-space:nowrap}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:70px}
.stat b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px}
.stat span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#top .grow{flex:1}
#city{font:inherit;font-family:'Silkscreen',monospace;color:var(--ink);background:#2b3646;border:2px solid #000;padding:4px 6px;cursor:pointer}
#top .btns{display:flex;gap:4px}
#top .btns button{padding:4px 8px;min-width:32px}
#search{position:fixed;left:8px;top:66px;width:280px;z-index:5;padding:6px}
#search input{width:100%;font:inherit;color:var(--ink);background:#0e1319;border:2px solid #000;padding:6px 8px;outline:none}
#search input:focus{border-color:var(--gold)}
#sres div{padding:5px 6px;cursor:pointer;border-bottom:1px solid var(--line)}
#sres div:hover{background:#26303d}
#sres small{color:var(--mute)}
#left{position:fixed;left:8px;top:112px;width:280px;bottom:236px;z-index:4;display:flex;flex-direction:column}
#tabs{display:flex}
#tabs button{flex:1;padding:5px 4px;font-size:11px}
#tabbody{flex:1;overflow:auto;padding:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.row span:first-child{color:var(--mute)}
.pitem{padding:6px;border:1px solid var(--line);margin-bottom:5px;cursor:pointer;background:#18202a}
.pitem:hover{border-color:var(--gold)}
.news{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.news .d{color:var(--mute);font-size:10px}
.pos{color:var(--green)} .neg{color:var(--red)}
#info{position:fixed;right:8px;top:66px;width:320px;max-height:calc(100% - 80px);overflow:auto;z-index:5;padding:12px;display:none}
#info h2{margin:0 0 2px;font-size:15px;line-height:1.25}
#info .sub{color:var(--mute);font-size:12px;margin-bottom:8px}
#info .tag{display:inline-block;padding:1px 6px;margin:2px 3px 2px 0;font-size:10px;border:1px solid #000;background:#2b3646;text-transform:uppercase;letter-spacing:.05em}
#info .tag.gold{background:#7a5a16;color:#ffe9b0}
#info .tag.red{background:#7a2620}
#info hr{border:0;border-top:2px solid var(--line);margin:8px 0}
#info .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#info .acts button{flex:1 1 45%}
#info .x{position:absolute;right:8px;top:8px;padding:2px 7px}
.slider{display:flex;align-items:center;gap:8px;margin:6px 0}
.slider input{flex:1;accent-color:var(--gold)}
#nav{position:fixed;right:8px;bottom:56px;z-index:4;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
#nav button{padding:0;width:32px;height:30px;font-size:13px;touch-action:none}
#nav .pad{display:grid;grid-template-columns:repeat(3,32px);gap:3px}
#nav .pad2{display:grid;grid-template-columns:repeat(2,32px);gap:3px}
#compass{width:40px!important;height:40px!important;border-radius:50%!important;display:flex;align-items:center;justify-content:center}
#needle{transition:none}
#mini{position:fixed;left:8px;bottom:8px;z-index:4;padding:4px;width:212px}
#mini canvas{display:block;width:200px;height:228px;image-rendering:pixelated;cursor:crosshair}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;z-index:4;padding:5px 10px;font-size:11px;color:var(--mute);white-space:nowrap}
#hint kbd{font-family:"IBM Plex Mono",monospace;background:#0e1319;border:1px solid #000;padding:0 4px;color:var(--ink)}
#tools{position:fixed;right:8px;bottom:8px;z-index:4;display:flex;gap:4px;padding:4px}
#tools button{font-size:11px;padding:5px 8px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;font-family:"Silkscreen",monospace;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;white-space:nowrap}
.lbl.q{font-size:14px;color:#ffe9b0}
.lbl.own{color:var(--gold)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.t{padding:8px 14px;font-size:13px;animation:fade 4.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;z-index:20;background:rgba(8,12,18,.7);display:flex;align-items:center;justify-content:center}
#modal .box{max-width:640px;width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;padding:22px 24px}
#modal h1{font-family:"Silkscreen",monospace;color:var(--gold);font-size:26px;margin:0 0 4px;text-shadow:3px 3px 0 #000}
#modal p,#modal li{line-height:1.5;color:#d4dbe2}
#modal ul{padding-left:18px;margin:6px 0}
#modal .src{font-size:11.5px;color:var(--mute)}
#modal .src a{color:var(--blue)}
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#141a22;gap:14px}
#loading .bar{width:260px;height:14px;border:2px solid #000;background:#0e1319;box-shadow:inset 0 0 0 2px var(--line)}
#loading .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#flyhint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;display:none;font-size:22px;color:#fff;text-shadow:1px 1px 0 #000}
@media (max-width:820px){
  #nav{bottom:56px;transform:scale(.9);transform-origin:right bottom}
  #left{display:none} #search{width:calc(100% - 16px)} #hint{display:none}
  #info{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:55%}
  #mini{display:none}
  #top{gap:8px}.stat{min-width:56px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="flyhint">+</div>

<div id="top" class="panel">
  <div class="logo px">SWISS BLOCKS</div>
  <select id="city" title="Stadt wechseln"></select>
  <div class="stat"><span>Datum</span><b id="sDate">–</b></div>

  <div class="btns">
    <button id="bPause" title="Pause (Leertaste)">❚❚</button>

  <div id="sres"></div>
</div>

<div id="left" class="panel">
  <div id="tabs">
    <button data-t="port" class="on">Portfolio</button>

    <button data-t="news">News</button>
  </div>
  <div id="tabbody"></div>
</div>

<div id="info" class="panel"></div>

<div id="mini" class="panel"><canvas id="mc" width="332" height="379"></canvas></div>

<div id="hint" class="panel">
  <kbd>Klick</kbd> wählen · <kbd>Ziehen</kbd> verschieben · <kbd>Rechts-Ziehen</kbd> drehen/neigen · <kbd>Rad</kbd> zoomen · <kbd>←↑→↓</kbd> bewegen · <kbd>Q E</kbd> drehen · <kbd>R F</kbd> neigen · <kbd>V</kbd> fliegen
</div>

<div id="tools" class="panel">
  <button id="tHeat" title="Preis-Heatmap (H)">Heatmap</button>
  <button id="tLbl" class="on" title="Beschriftungen (L)">Labels</button>
  <button id="tNight" title="Nacht (N)">Nacht</button>
  <button id="tFly" title="Flugmodus (V)">Fliegen</button>
</div>

<div id="nav" class="panel">
  <button id="compass" title="Nach Norden ausrichten (C)"><svg id="needle" viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 L16 12 L12 10 L8 12Z" fill="#e94b3c"/><path d="M12 22 L8 12 L12 14 L16 12Z" fill="#dfe6ee"/></svg></button>
  <div class="pad">
    <span></span><button data-n="up" title="Vorwärts (↑)">▲</button><span></span>
    <button data-n="left" title="Links (←)">◀</button><button data-n="zin" title="Zoom +">＋</button><button data-n="right" title="Rechts (→)">▶</button>
    <span></span><button data-n="down" title="Zurück (↓)">▼</button><button data-n="zout" title="Zoom −">－</button>
  </div>
  <div class="pad2">
    <button data-n="rotl" title="Links drehen (Q)">⟲</button><button data-n="rotr" title="Rechts drehen (E)">⟳</button>
    <button data-n="tiltup" title="Steiler (R)">⤒</button><button data-n="tiltdn" title="Flacher (F)">⤓</button>
  </div>
</div>
<div id="toast"></div>

<div id="loading"><div class="px" style="font-size:22px;color:var(--gold)">SWISS BLOCKS</div><div class="bar"><i id="lbar"></i></div><div id="lmsg" style="color:var(--mute)">Lade Stadtmodell…</div></div>

<div id="modal" style="display:none"><div class="box panel" id="mbox"></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ============================== DATA ============================== */
const $=s=>document.querySelector(s);
const lbar=$('#lbar'), lmsg=$('#lmsg');
const tick=()=>new Promise(r=>setTimeout(r,0));
async function gunzip(b64){
  const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
const CITYDEF={
  zurich:{name:'Zürich',file:'data.js',price:16559,rent:26.5,start:/Grossmünster/,heat:[13000,27000],growth:.0037},
  geneva:{name:'Genève',file:'data_ge.js',price:17145,rent:501/12,start:/Saint-Pierre|Cathédrale/,heat:[12000,23000],growth:.0021},
  lausanne:{name:'Lausanne',file:'data_la.js',price:14388,rent:328/12,start:/Cathédrale/,heat:[10000,19000],growth:.0021},
  zug:{name:'Zug',file:'data_zg.js',price:17059,rent:405/12,start:/St\. ?Oswald|Zytturm|Kirche/,heat:[12000,23000],growth:.0050},
  lucerne:{name:'Luzern',file:'data_lu.js',price:14124,rent:299/12,start:/Kapellbrücke|Jesuitenkirche|Hofkirche/,heat:[10000,19000],growth:.0042},
  basel:{name:'Basel',file:'data_bs.js',price:11937,rent:336/12,start:/Münster/,heat:[8500,16000],growth:.0021},
  bern:{name:'Bern',file:'data_be.js',price:7763,rent:272/12,start:/Bundeshaus|Zytglogge|Münster/,heat:[5500,10500],growth:.0021},
  stgallen:{name:'St. Gallen',file:'data_sg.js',price:9151,rent:275/12,start:/Kathedrale|Stiftskirche|Stiftsbezirk/,heat:[6500,12500],growth:.0033},
  lugano:{name:'Lugano',file:'data_lg.js',price:8091,rent:260/12,start:/Cattedrale|San Lorenzo|Municipio/,heat:[5500,11000],growth:-.0030},
};
let CITY=location.hash.slice(1); if(!CITYDEF[CITY])CITY='zurich';
const CD=CITYDEF[CITY];
lmsg.textContent='Lade '+CD.name+'…';
await new Promise((res,rej)=>{const s=document.createElement('script');s.src=CD.file;s.onload=res;s.onerror=()=>rej(new Error('Daten für '+CD.name+' fehlen'));document.head.appendChild(s)});
lmsg.textContent='Entpacke Stadtmodell…'; await tick();
const gridRaw=await gunzip(window.ZDATA.grid); lbar.style.width='20%';
const META=JSON.parse(new TextDecoder().decode(await gunzip(window.ZDATA.meta))); lbar.style.width='28%';
const W=META.W, H=META.H, N=W*H, CS=2, BS=2, BASE=META.base??380, Y0=META.Y0??395;
const ID=new Uint16Array(gridRaw.buffer.slice(0,N*2));
const TOPR=new Uint16Array(gridRaw.buffer.slice(N*2,N*4));
const GRD=new Uint16Array(gridRaw.buffer.slice(N*4,N*6));
const LC=gridRaw.slice(N*6,N*7), QG=gridRaw.slice(N*7,N*8);
const ART=META.art, BM=META.M, ADDR=META.addr, QT=META.Q, NB=BM.length;
const artName=a=>({Gebaeude_Wohngebaeude:'Wohngebäude',Gebaeude_Verwaltung:'Verwaltung / Büro',Gebaeude_Handel:'Handel',Gebaeude_Gastgewerbe:'Gastgewerbe',Gebaeude_Industrie_Gewerbe:'Industrie / Gewerbe',Gebaeude_Verkehr:'Verkehr',Gebaeude_Nebengebaeude:'Nebengebäude',Unterstand:'Unterstand',Bruecke_Passerelle:'Brücke / Passerelle',Hochkamin:'Hochkamin',Silo_Turm_Gasometer:'Silo / Turm',uebriger_Gebaeudeteil:'Gebäudeteil',Gebaeude_Land_Forstwirtschaft_Gaertnerei:'Gärtnerei',Landungssteg:'Landungssteg',Massiver_Sockel:'Sockel',Kirche:'Kirche / Sakralbau',Baustelle:'Baustelle'}[a]||a);
const TYPEF={Gebaeude_Wohngebaeude:[1,1,1],Gebaeude_Verwaltung:[.85,.9,1],Gebaeude_Handel:[.95,1.05,1],Gebaeude_Gastgewerbe:[.9,.95,1],Gebaeude_Industrie_Gewerbe:[.55,.6,1],Gebaeude_Verkehr:[.5,.6,1],Gebaeude_Nebengebaeude:[.35,.35,1],uebriger_Gebaeudeteil:[.7,.7,1],Gebaeude_Land_Forstwirtschaft_Gaertnerei:[.4,.4,1]};

const bCells=Array.from({length:NB},()=>[]);
for(let i=0;i<N;i++){const b=ID[i];if(b)bCells[b-1].push(i)}
const bQ=new Uint8Array(NB), bCx=new Float32Array(NB), bCy=new Float32Array(NB);
for(let b=0;b<NB;b++){const c=bCells[b];if(!c.length)continue;let sx=0,sy=0;const qc={};for(const i of c){sx+=i%W;sy+=(i/W|0);const q=QG[i];qc[q]=(qc[q]||0)+1}bCx[b]=sx/c.length;bCy[b]=sy/c.length;let best=0,bn=0;for(const k in qc)if(qc[k]>bn){bn=qc[k];best=+k}bQ[b]=best}
const bName=new Array(NB).fill(null); const LANDMARK=[];
{const seen=new Set();for(const [nm,x,y,bid] of META.names){if(bid>0&&!bName[bid-1])bName[bid-1]=nm;if(!seen.has(nm)){seen.add(nm);LANDMARK.push({nm,x,y,bid})}}}
lbar.style.width='35%'; await tick();

/* ============================== WORLD (2 m voxels) ============================== */
const lvl=dm=>Math.round((dm/10+BASE-Y0)/BS);
const gq=new Int16Array(N), top=new Int16Array(N), base=new Int16Array(N), eave=new Int16Array(N), deck=new Int16Array(N);
const bBase=new Int16Array(NB), bEave=new Int16Array(NB), bExtra=new Int16Array(NB), bGlass=new Uint8Array(NB), bBridge=new Uint8Array(NB), bChurch=new Uint8Array(NB), bTopMax=new Int16Array(NB);
for(let i=0;i<N;i++)gq[i]=Math.max(1,lvl(GRD[i]));
for(let b=0;b<NB;b++){
  const [a,gb,tr,fi]=BM[b]; const art=ART[a];
  bBase[b]=Math.max(1,Math.round((gb/10-Y0)/BS));
  bEave[b]=Math.max(1,Math.round(tr/10/BS));
  if(art==='Bruecke_Passerelle'||art==='Landungssteg')bBridge[b]=1;
  bGlass[b]=fi/10>45||(art==='Gebaeude_Verwaltung'&&fi/10>32)?1:0;
  if(/Kirche|münster|Münster|Kapelle|Predigern|Cathédrale|Cattedrale|Kathedrale|Temple|Église|Chiesa/.test(bName[b]||'')||art==='Kirche')bChurch[b]=1;
}
function colFor(i){
  const b=ID[i]-1; deck[i]=0;
  if(b>=0&&bBridge[b]){top[i]=gq[i];base[i]=gq[i];eave[i]=gq[i];const d=lvl(TOPR[i]&0x7fff);if(d>gq[i]+1)deck[i]=d;else top[i]=Math.max(gq[i],d);return}
  if(b>=0){
    const bb=bBase[b]; const r=TOPR[i]&0x7fff; const t=Math.max(bb+1,lvl(r)+bExtra[b]);
    top[i]=t; base[i]=bb;
    eave[i]=(TOPR[i]>>15)?Math.min(t,bb+bEave[b]+bExtra[b]):t;
  } else {top[i]=gq[i];base[i]=gq[i];eave[i]=gq[i]}
}
for(let i=0;i<N;i++)colFor(i);
function calcTopMax(b){let m=0;for(const i of bCells[b])if(top[i]>m)m=top[i];bTopMax[b]=m}
for(let b=0;b<NB;b++)calcTopMax(b);
lbar.style.width='42%'; await tick();

/* ============================== COLORS ============================== */
const LCOL={0:0xbdb7ac,1:0x2f6f9f,2:0x55595f,3:0xb9b3a6,4:0xcdb98f,5:0x7b6a5a,6:0x6cab4f,7:0x3f7a35,8:0x91c05c,9:0x5f9b4b,10:0x80993c,11:0xaaa59b,12:0xa9a49c,13:0x8fae6a};
const LSIDE={0:0x8e877c,1:0x2f6f9f,2:0x6a6a6a,3:0x8e877c,4:0x8a6b45,5:0x6a5848,6:0x7a5634,7:0x6b4a2c,8:0x7a5634,9:0x7a5634,10:0x7a5634,11:0x8e877c,12:0x8e877c,13:0x7a5634};
const FACADE=[0xefe6d2,0xe8d9b5,0xdcc9a3,0xf2efe8,0xd9cfc3,0xe9c9a8,0xcdbfa8,0xe3dccb,0xd4b896,0xf0dcc0,0xe6e1d6,0xd8c4a6];
const OFFICE=[0xc3c7cb,0xb0b8c0,0xd2d0ca,0xa9b2ba,0xbcb6ab];
const hex=h=>[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295}
const bWall=new Uint32Array(NB), bRoofC=new Uint32Array(NB), bFlatC=new Uint32Array(NB);
for(let b=0;b<NB;b++){
  const art=ART[BM[b][0]], r=hash2(b,7), rr=hash2(b,3);
  let w;
  if(bChurch[b]) w=0xcdbd9c;
  else if(bGlass[b]) w=0x6f8fa3;
  else if(art==='Gebaeude_Verwaltung') w=OFFICE[(r*OFFICE.length)|0];
  else if(art==='Gebaeude_Industrie_Gewerbe') w=r<.5?0x9a5a44:0xa8a39a;
  else if(art==='Gebaeude_Verkehr') w=0xc8bca4;
  else if(art==='Gebaeude_Nebengebaeude'||art==='Unterstand') w=0xa08f7a;
  else w=FACADE[(r*FACADE.length)|0];
  bWall[b]=w;
  bRoofC[b]=bChurch[b]?(rr<.5?0x5f8a78:0x9a4a36):(rr<.55?0xa4503a:rr<.8?0x8c4632:rr<.92?0x6c5a52:0x5a6670);

  for(let i=n;i<lblPool.length;i++)lblPool[i].style.display='none';
}

/* ============================== INTRO ============================== */
function showIntro(first){
  $('#modal').style.display='flex';
  $('#mbox').innerHTML=`<h1>SWISS BLOCKS</h1><div style="color:var(--mute);margin-bottom:10px">Voxel-Immobilien-Tycoon in 9 Schweizer Städten · aktuell: <b style="color:var(--ink)">${esc(CD.name)}</b></div>
  <p>Zürich, Genf, Lausanne, Zug, Luzern, Basel, Bern, St. Gallen und Lugano — jeweils die Innenstadt in <b>2-Meter-Blöcken</b> mit echten Dachformen aus offiziellen 3D-Gebäudemodellen, echten Adressen und Bäumen. Ein Portfolio, alle Städte: wechsle oben links die Stadt.</p>
  <ul>
    <li><b>Kaufe</b> Liegenschaften mit bis zu 80 % Hypothek, kassiere Mieten, zahle Zinsen & Unterhalt.</li>
    <li><b>Renoviere</b> oder <b>stocke auf</b> (+1 Geschoss mit Baubewilligung). In Altstädten ist das schwierig.</li>
    <li>Jede Stadt hat ihr eigenes Preisniveau und Wachstum — Zug und Luzern boomen, Lugano schwächelt.</li>
    <li>Ziel: <b>CHF 250 Mio. Nettovermögen</b>.</li>
  </ul>
  <p style="font-size:12px;color:#c7d0d9"><b>Steuerung:</b> Klick = Gebäude wählen · Ziehen = verschieben · Rechts-Ziehen / Ctrl+Ziehen = drehen & neigen · Rad / Pinch = zoomen · Doppelklick = hinfliegen · Pfeiltasten/WASD · Q/E drehen · R/F neigen · +/− zoomen · C = Norden · V = Flugmodus.</p>
  <p class="src"><b>Zürich:</b> Stadt Zürich Open Data — <a href="https://data.stadt-zuerich.ch/dataset/geo_bauten___dachmodell" target="_blank" rel="noopener">Dachmodell LoD2</a>, Blockmodell, Amtliche Vermessung, Baumkataster, Statistische Quartiere; Statistik Stadt Zürich (STWE-Preise 2023–25, Mietpreiserhebung 2026).
  <br><b>Übrige Städte:</b> swisstopo <a href="https://www.swisstopo.admin.ch/de/landschaftsmodell-swissbuildings3d-3-0-beta" target="_blank" rel="noopener">swissBUILDINGS3D</a> (3D Tiles), swisstopo Basiskarte (Vektortiles: Gewässer, Strassen, Grünflächen, Bäume, Namen), BFS Gebäude- und Wohnungsregister (Adressen). Wohnungspreise/m²: neho.ch Stadtwerte 2026 (Zug: Kanton); Mieten: kantonale Angebotsmieten (RealAdvisor via bonus.ch), Lugano geschätzt. Lagefaktor ±15 % nach Distanz zum Zentrum = Spielannahme.
  <br><b>Spielannahmen:</b> Nutzfläche = Grundfläche × Geschosse × 0.8; Hypozins, Steuern, Baukosten, Wachstum und Ereignisse vereinfacht.</p>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
    ${first&&hasSave?'<button class="primary" id="mCont">Weiterspielen</button>':''}
    <button class="${first&&hasSave?'':'primary'}" id="mNew">${first?'Neues Spiel':'Weiter'}</button>
    ${!first?'<button class="danger" id="mReset">Neues Spiel starten</button>':''}
  </div>`;
  const close=()=>{$('#modal').style.display='none'};
  if($('#mCont'))$('#mCont').onclick=()=>{close();setSpeed(1)};
  $('#mNew').onclick=()=>{if(first&&hasSave){resetGame()}close();setSpeed(1)};
  if($('#mReset'))$('#mReset').onclick=()=>{resetGame();close();setSpeed(1)};
}
function resetGame(){for(let b=0;b<NB;b++)if(bExtra[b]){bExtra[b]=0;rebuildBuilding(b)}newGame();allState();refresh();select(-1)}
function showWin(){setSpeed(0);$('#modal').style.display='flex';$('#mbox').innerHTML=`<h1>BAHNHOFSTRASSEN-BARON</h1><p>Du hast ein Nettovermögen von <b>${chf(netWorth())}</b> erreicht — im ${MONTHS[G.month]} ${G.year}. Zürich liegt dir zu Füssen.</p><button class="primary" onclick="document.querySelector('#modal').style.display='none'">Weiterspielen</button>`}


/* ============================== NAV PAD ============================== */
document.querySelectorAll('#nav [data-n]').forEach(bt=>{const k=bt.dataset.n;
  const on=e=>{e.preventDefault();NAV[k]=true;flyTarget=null;bt.setPointerCapture?.(e.pointerId)},off=()=>{NAV[k]=false};
  bt.addEventListener('pointerdown',on);bt.addEventListener('pointerup',off);bt.addEventListener('pointercancel',off);bt.addEventListener('pointerleave',off)});
$('#compass').onclick=()=>{flyTarget=null;const y0=cam.yaw;const tgt=Math.round(y0/(2*Math.PI))*2*Math.PI;compassAnim={from:y0,to:tgt,t:0}};
let compassAnim=null;

/* ============================== LOOP ============================== */
window.__dbg={monthTick:()=>monthTick(),sel:()=>selB,buyable,focusB,G:()=>G,cam,chunks:()=>chunks,info:()=>renderer.info.render};
const hasSave=load();
if(!hasSave)newGame();
{const p={x:window.__center[0],y:window.__center[1]};cam.tx=(p.x+.5)*CS-40;cam.tz=(p.y+.5)*CS;cam.ty=groundAt(cam.tx,cam.tz);cam.dist=360;cam.yaw=-Math.PI/2-.35;cam.pitch=.42}
allState(); drawMiniBase(true); refresh(); setSpeed(0);
applyCam(0); camera.updateMatrixWorld(); lodR=750; for(let k=0;k<40;k++){updateLOD()}
$('#loading').remove();
try{const f=sessionStorage.getItem('zb_focus');if(f!=null){sessionStorage.removeItem('zb_focus');setTimeout(()=>focusB(+f),300)}}catch(e){}
showIntro(true);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),acc=0,dayF=1,miniT=0,lblT=0,fpsA=60;
const skyDay=new THREE.Color(0xc4d8e8),skyNight=new THREE.Color(0x182238),gDay=new THREE.Color(0x9fb39a),gNight=new THREE.Color(0x1c2a24);
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;fpsA=fpsA*.95+(1/Math.max(dt,1e-3))*.05;
  updateMove(dt);
  if(compassAnim){compassAnim.t=Math.min(1,compassAnim.t+dt*2.5);const e=1-Math.pow(1-compassAnim.t,3);cam.yaw=compassAnim.from+(compassAnim.to-compassAnim.from)*e;if(compassAnim.t>=1)compassAnim=null}
  if(flyTarget){const k=1-Math.pow(.015,dt);cam.tx+=(flyTarget.x-cam.tx)*k;cam.tz+=(flyTarget.z-cam.tz)*k;cam.dist+=(flyTarget.d-cam.dist)*k;if(Math.hypot(flyTarget.x-cam.tx,flyTarget.z-cam.tz)<1&&Math.abs(flyTarget.d-cam.dist)<2)flyTarget=null}
  applyCam(dt);
  // adapt detail radius to frame rate
  if(fpsA<28&&lodR>420)lodR-=4;else if(fpsA>50&&lodR<1100)lodR+=2;
  updateLOD();
  if(G.speed){acc+=dt*G.speed;if(acc>=6){acc=0;monthTick()}}
  dayF+=((night?0:1)-dayF)*Math.min(1,dt*2);
  U.day.value=dayF;U.time.value=now/1000;
  const fc=skyNight.clone().lerp(skyDay,dayF);U.fogCol.value.copy(fc);scene.fog.color.copy(fc);
  outerMat.color.copy(gNight.clone().lerp(gDay,dayF));
  document.body.style.background=`linear-gradient(to bottom, ${skyNight.clone().lerp(new THREE.Color(0x5b95cf),dayF).getStyle()} 0%, ${fc.getStyle()} 55%)`;
  U.sunDir.value.set(.45,.25+.55*dayF,.35).normalize();
  $('#needle').style.transform=`rotate(${(fly?flyA.yaw+Math.PI:cam.yaw)}rad)`;
  renderer.render(scene,camera);
  lblT+=dt;if(lblT>.05){lblT=0;drawLabels()}
  miniT+=dt;if(miniT>.15){miniT=0;drawMini()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
