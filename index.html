<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Blocks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pause" viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></symbol>
  <symbol id="i-fast" viewBox="0 0 16 16"><path d="M1 2l7 6-7 6zM8 2l7 6-7 6z"/></symbol>
  <symbol id="i-help" viewBox="0 0 16 16"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm.9 11.2H7.1V10.5h1.8zm1.6-5.6c-.3.6-.8 1-1.3 1.3-.4.3-.5.5-.5 1v.3H7.1v-.5c0-.9.4-1.4 1-1.8.5-.3.8-.6.8-1.1 0-.5-.4-.8-.9-.8-.6 0-1 .4-1 1H5.2c.1-1.7 1.3-2.6 2.9-2.6 1.6 0 2.7.9 2.7 2.2 0 .4-.1.7-.3 1z"/></symbol>
  <symbol id="i-home" viewBox="0 0 16 16"><path d="M8 1.5l7 6.2-1 1.1-1-.9V14H9.5v-4h-3v4H3V7.9l-1 .9-1-1.1z"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M3.4 2L8 6.6 12.6 2 14 3.4 9.4 8l4.6 4.6-1.4 1.4L8 9.4 3.4 14 2 12.6 6.6 8 2 3.4z"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 3l6 8H2z"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 13L2 5h12z"/></symbol>
  <symbol id="i-left" viewBox="0 0 16 16"><path d="M3 8l8-6v12z"/></symbol>
  <symbol id="i-right" viewBox="0 0 16 16"><path d="M13 8l-8 6V2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M7 2h2v5h5v2H9v5H7V9H2V7h5z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M2 7h12v2H2z"/></symbol>
  <symbol id="i-rotl" viewBox="0 0 16 16"><path d="M3.5 8A4.5 4.5 0 1 0 8 3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 0.5v6l-3.5-3z"/></symbol>
  <symbol id="i-rotr" viewBox="0 0 16 16"><path d="M12.5 8A4.5 4.5 0 1 1 8 3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 0.5v6l3.5-3z"/></symbol>
  <symbol id="i-tiltup" viewBox="0 0 16 16"><path d="M2 2h12v2H2zM8 5l5 6H9.5v4h-3v-4H3z"/></symbol>
  <symbol id="i-tiltdn" viewBox="0 0 16 16"><path d="M2 12h12v2H2zM8 11L3 5h3.5V1h3v4H13z"/></symbol>
</svg>

<main id="home" class="home" hidden></main>

<section id="game" class="game" hidden>
  <div id="stage"></div>
  <div id="labels" class="labels"></div>
  <div id="fx" class="labels"></div>
  <div id="crosshair" class="crosshair" hidden></div>

  <header id="topbar" class="panel topbar">
    <button id="bHome" class="icon" data-i18n-title="top.home"><svg><use href="#i-home"/></svg></button>
    <div class="brand" data-i18n="app.title"></div>
    <select id="citySelect" data-i18n-aria="top.city"></select>
    <div class="stat"><span data-i18n="top.title"></span><b id="sTitle"></b></div>
    <div class="stat"><span data-i18n="top.date"></span><b id="sDate"></b></div>
    <div class="stat"><span data-i18n="top.cash"></span><b id="sCash"></b></div>
    <div class="stat"><span data-i18n="top.debt"></span><b id="sDebt"></b></div>
    <div class="stat"><span data-i18n="top.net"></span><b id="sNet"></b></div>
    <div class="stat"><span data-i18n="top.flow"></span><b id="sFlow"></b></div>
    <div class="stat"><span data-i18n="top.rate"></span><b id="sRate"></b></div>
    <div class="spacer"></div>
    <div class="speed">
      <button id="bPause" class="icon" data-i18n-title="top.pause"><svg><use href="#i-pause"/></svg></button>
      <button id="bPlay" class="icon" data-i18n-title="top.play"><svg><use href="#i-play"/></svg></button>
      <button id="bFast" class="icon" data-i18n-title="top.fast"><svg><use href="#i-fast"/></svg></button>
      <button id="bHelp" class="icon" data-i18n-title="top.help"><svg><use href="#i-help"/></svg></button>
    </div>
    <div id="gameLang"></div>
  </header>

  <div id="search" class="panel search">
    <input id="searchInput" autocomplete="off">
    <div id="searchResults"></div>
  </div>

  <aside id="sidebar" class="panel sidebar">
    <nav id="tabs" class="tabs">
      <button data-tab="portfolio" data-i18n="tab.portfolio"></button>
      <button data-tab="goals" data-i18n="tab.goals"></button>
      <button data-tab="defects" data-i18n="tab.defects"></button>
      <button data-tab="score" data-i18n="tab.score"></button>
      <button data-tab="market" data-i18n="tab.market"></button>
      <button data-tab="news" data-i18n="tab.news"></button>
    </nav>
    <div id="tabBody" class="tab-body"></div>
  </aside>

  <aside id="info" class="panel info" hidden></aside>

  <div id="mini" class="panel mini"><canvas id="minimap" width="332" height="379"></canvas></div>

  <div id="hint" class="panel hint" data-i18n="hint.keys"></div>

  <div id="tools" class="panel tools">
    <button id="tHeat" data-i18n="tool.heat" data-i18n-title="tool.heatTitle"></button>
    <button id="tLabels" class="on" data-i18n="tool.labels" data-i18n-title="tool.labelsTitle"></button>
    <button id="tNight" data-i18n="tool.night" data-i18n-title="tool.nightTitle"></button>
    <button id="tFly" data-i18n="tool.fly" data-i18n-title="tool.flyTitle"></button>
  </div>

  <div id="nav" class="panel nav">
    <button id="compass" class="compass" data-i18n-title="nav.north">
      <svg id="needle" viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l4 10-4-2-4 2z" fill="#d52b1e"/><path d="M12 22l-4-10 4 2 4-2z" fill="#9aa0a6"/></svg>
    </button>
    <div class="pad">
      <span></span><button data-nav="up" data-i18n-title="nav.up"><svg><use href="#i-up"/></svg></button><span></span>
      <button data-nav="left" data-i18n-title="nav.left"><svg><use href="#i-left"/></svg></button>
      <button data-nav="zin" data-i18n-title="nav.zin"><svg><use href="#i-plus"/></svg></button>
      <button data-nav="right" data-i18n-title="nav.right"><svg><use href="#i-right"/></svg></button>
      <span></span><button data-nav="down" data-i18n-title="nav.down"><svg><use href="#i-down"/></svg></button>
      <button data-nav="zout" data-i18n-title="nav.zout"><svg><use href="#i-minus"/></svg></button>
    </div>
    <div class="pad two">
      <button data-nav="rotl" data-i18n-title="nav.rotl"><svg><use href="#i-rotl"/></svg></button>
      <button data-nav="rotr" data-i18n-title="nav.rotr"><svg><use href="#i-rotr"/></svg></button>
      <button data-nav="tiltup" data-i18n-title="nav.tiltup"><svg><use href="#i-tiltup"/></svg></button>
      <button data-nav="tiltdn" data-i18n-title="nav.tiltdn"><svg><use href="#i-tiltdn"/></svg></button>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
</section>

<div id="loading" class="loading" hidden>
  <div class="brand" data-i18n="app.title"></div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadText"></div>
</div>

<div id="modal" class="modal" hidden><div id="modalBox" class="panel modal-box"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
